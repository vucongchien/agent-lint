version: "1.0"
target:
  include:
    - "src/**/*.{tsx,jsx}"
  exclude:
    - "**/*.test.{tsx,jsx}"
    - "**/node_modules/**"
    - "**/.next/**"
    - "**/dist/**"

rules:
  # 1. i18n Hardcode Detection & Auto-Sync
  i18n:
    enabled: true
    severity: "error"
    locales:
      dir: "auto"
      default: "auto"
      supported: "auto"
      file_format: "json"
    integration:
      framework: "auto"
      hook_name: "useTranslations"
      function_name: "t"
      auto_import: true
      import_source: "next-intl"
    key_generation:
      strategy: "slug"
      max_length: 40
      prefix: ""
    attributes:
      - "placeholder"
      - "title"
      - "alt"
      - "aria-label"
      - "aria-description"
    whitelist:
      - "&times;"
      - "OK"
      - "Beta"
    ignore_patterns:
      - "^[0-9]+$"
      - "^[\\s\\-_/|:,.]+$"
      - "^https?://"
      - "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"

  # 2. Design Token Compliance
  design_tokens:
    enabled: true
    severity: "warn"
    provider: "tailwind"
    enforce:
      colors: true
      spacing: true
      font_sizes: true
    suggestion:
      auto_suggest: true
      color_tolerance: 0.85
    
    # 3. Enforce Design System Custom Components
    enforce_components:
      enabled: true
      severity: "error"
      restricted_elements:
        button:
          use: "Button"
          from: "@/components/ui/button"
          message: "Please use <Button /> from Design System instead of raw <button> tag."
        a:
          use: "Link"
          from: "next/link"
          message: "Please use <Link /> from next/link for client-side navigation."
        img:
          use: "Image"
          from: "next/image"

  # 3. Clean Architecture: Composition-First Pages & Layouts
  clean_composition:
    enabled: true
    severity: "warn"
    targets:
      - "**/page.{tsx,jsx}"
      - "**/layout.{tsx,jsx}"
    max_raw_jsx_depth: 3
    max_raw_element_ratio: 0.6

  # 4. Component & Layout Deduplication Advisor (Rule of Three)
  component_deduplication:
    enabled: true
    severity: "warn"
    min_occurrences: 3
    min_element_count: 4
    similarity_threshold: 0.80

  # 5. Architecture & Layer Boundary Governance (Presets: nextjs | clean-architecture | fsd | ddd)
  architecture:
    enabled: true
    preset: "nextjs"
    severity: "error"
    allow_type_imports: true
    server_client_boundary:
      enabled: true
      disallowed_imports:
        - "@/lib/db"
        - "prisma"
        - "@prisma/client"
        - "server-only"
        - "fs"
        - "path"

  # 6. Design Craft & Visual Quality (Anti-AI Slop & Optical Physics)
  design_craft:
    enabled: true
    severity: "warn"
    no_side_accent_border: true           # Cấm viền dày 1 bên mép card (border-l-4)
    no_gradient_text: true                # Cấm chữ dải màu lòe loẹt (bg-clip-text text-transparent)
    no_glowing_shadows: true              # Cấm bóng đổ phát sáng màu mè (shadow-[0_0_...px])
    no_nested_cards: true                 # Cấm card lồng trong card
    no_eyebrow_kicker: true               # Cấm nhãn in hoa đè trên heading
    no_fake_pulse_dot: true               # Cấm animate-ping trên status dot tĩnh
    no_ghost_card: true                   # Cấm vừa viền dày vừa bóng to trên cùng 1 card
    optical_kerning: true                 # Chữ càng nhỏ thì tracking/kerning phải càng rộng
    dark_mode_optical_compensation: true  # Bù trừ quang sai phát xạ trong Dark Mode (x - x/16)
    critical_alert_signifiers: true        # Cảnh báo nguy hiểm phải có Icon và viền phân cấp mạnh
    type_scale_jump: true                 # Tiêu đề và nội dung phụ phải nhảy tối thiểu 2 bậc scale
    optical_centering: true               # Căn giữa quang học mắt người (Padding Top < Bottom: 1 : 1.2)
    entity_grid_gap_ratio: true           # Khoảng cách Grid giữa các sản phẩm bằng 1/3 Card Width



