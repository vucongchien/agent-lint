version: "1.0"
target:
  include:
    - "src/**/*.{tsx,jsx}"
  exclude:
    - "**/*.test.{tsx,jsx}"
    - "**/node_modules/**"
    - "**/.next/**"
    - "**/dist/**"

rules:
  # 1. i18n Hardcode Detection & Auto-Sync
  i18n:
    enabled: true
    severity: "error"
    locales:
      dir: "auto"
      default: "auto"
      supported: "auto"
      file_format: "json"
    integration:
      framework: "auto"
      hook_name: "useTranslations"
      function_name: "t"
      auto_import: true
      import_source: "next-intl"
    key_generation:
      strategy: "slug"
      max_length: 40
      prefix: ""
    attributes:
      - "placeholder"
      - "title"
      - "alt"
      - "aria-label"
      - "aria-description"
    whitelist:
      - "&times;"
      - "OK"
      - "Beta"
    ignore_patterns:
      - "^[0-9]+$"
      - "^[\\s\\-_/|:,.]+$"
      - "^https?://"
      - "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"

  # 2. Design Token Compliance
  design_tokens:
    enabled: true
    severity: "warn"
    provider: "tailwind"
    enforce:
      colors: true
      spacing: true
      font_sizes: true
    suggestion:
      auto_suggest: true
      color_tolerance: 0.85
    
    # 3. Enforce Design System Custom Components
    enforce_components:
      enabled: true
      severity: "error"
      restricted_elements:
        button:
          use: "Button"
          from: "@/components/ui/button"
          message: "Please use <Button /> from Design System instead of raw <button> tag."
        a:
          use: "Link"
          from: "next/link"
          message: "Please use <Link /> from next/link for client-side navigation."
        img:
          use: "Image"
          from: "next/image"

  # 3. Clean Architecture: Composition-First Pages & Layouts
  clean_composition:
    enabled: true
    severity: "warn"
    targets:
      - "**/page.{tsx,jsx}"
      - "**/layout.{tsx,jsx}"
    max_raw_jsx_depth: 3
    max_raw_element_ratio: 0.6

  # 4. Component & Layout Deduplication Advisor (Rule of Three)
  component_deduplication:
    enabled: true
    severity: "warn"
    min_occurrences: 3
    min_element_count: 4
    similarity_threshold: 0.80

  # 5. Architecture & Layer Boundary Governance (Presets: nextjs | clean-architecture | fsd | ddd)
  architecture:
    enabled: true
    preset: "nextjs"
    severity: "error"
    allow_type_imports: true
    server_client_boundary:
      enabled: true
      disallowed_imports:
        - "@/lib/db"
        - "prisma"
        - "@prisma/client"
        - "server-only"
        - "fs"
        - "path"

